<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ohmic promo</title>
    <style>
      @font-face {
        font-family: 'Inter';
        src: url('/fonts/inter/inter-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
        font-display: block;
      }
      @font-face {
        font-family: 'Mono';
        src: url('/fonts/jetbrains-mono/jetbrains-mono-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 800;
        font-display: block;
      }
      :root {
        --bg: #050505;
        --text: #f5f5f6;
        --muted: #a1a1a8;
        --faint: #6f6f76;
        --line: rgb(255 255 255 / 0.065);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        background: #000;
        overflow: hidden;
      }
      body {
        font-family: 'Inter', system-ui, sans-serif;
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }
      #stage {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--bg);
        transform-origin: 0 0;
      }
      .scene {
        position: absolute;
        inset: 0;
        display: none;
        overflow: hidden;
        background: var(--bg);
        perspective: 2400px;
        perspective-origin: 50% 42%;
      }
      .grid {
        position: absolute;
        left: -144px;
        top: -144px;
        width: 1368px;
        height: 2208px;
        background-image: linear-gradient(var(--line) 1.5px, transparent 1.5px), linear-gradient(90deg, var(--line) 1.5px, transparent 1.5px);
        background-size: 72px 72px;
        -webkit-mask-image: radial-gradient(ellipse 70% 50% at 50% 46%, #000 30%, transparent 85%);
        mask-image: radial-gradient(ellipse 70% 50% at 50% 46%, #000 30%, transparent 85%);
      }
      .glow {
        position: absolute;
        left: -260px;
        top: 380px;
        width: 1600px;
        height: 1600px;
        background: radial-gradient(closest-side, rgb(255 255 255 / 0.07), transparent);
      }
      svg.deco,
      svg.lines {
        position: absolute;
        left: 0;
        top: 0;
        overflow: visible;
      }

      /* Words */
      .eyebrow {
        position: absolute;
        left: 88px;
        top: 204px;
        font: 500 25px/1 'Mono', monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        white-space: pre;
      }
      .eyebrow b {
        color: var(--text);
        font-weight: 600;
      }
      .eyebrow .cur {
        display: inline-block;
        width: 0.6em;
        height: 1.05em;
        margin-left: 4px;
        background: var(--text);
        vertical-align: -0.16em;
      }
      .eyebrow .tag {
        display: inline-block;
        margin-left: 14px;
        padding: 6px 12px 5px;
        border: 1.5px solid currentColor;
        border-radius: 8px;
        color: var(--text);
        font-weight: 600;
        vertical-align: 0.02em;
      }
      .hl {
        position: absolute;
        left: 84px;
        top: 258px;
        font-weight: 760;
        font-size: 124px;
        line-height: 1.02;
        letter-spacing: -0.048em;
      }
      .hl .ln {
        display: block;
        white-space: nowrap;
      }
      .hl .wrap {
        position: relative;
        display: inline-block;
        vertical-align: top;
      }
      .hl .ln > .wrap.mark:not(:first-child) {
        margin-left: 0.07em;
      }
      .hl .w {
        display: inline-block;
        overflow: hidden;
        vertical-align: top;
        padding: 0.04em 0.04em 0.16em;
        margin: -0.04em -0.04em -0.16em;
      }
      .hl .i {
        display: inline-block;
      }
      .hl .hi {
        position: absolute;
        left: -0.1em;
        right: -0.1em;
        top: 0.07em;
        bottom: -0.08em;
        border-radius: 0.17em;
        background: var(--text);
        overflow: hidden;
      }
      .hl .ink {
        position: absolute;
        left: 0.1em;
        top: -0.07em;
        color: var(--bg);
        white-space: nowrap;
      }

      /* Callouts */
      .chip {
        position: absolute;
        left: 0;
        top: 0;
        display: inline-flex;
        align-items: center;
        gap: 14px;
        padding: 17px 26px 16px 20px;
        border-radius: 999px;
        background: rgb(16 16 18 / 0.86);
        border: 1.5px solid rgb(255 255 255 / 0.17);
        -webkit-backdrop-filter: blur(16px);
        backdrop-filter: blur(16px);
        font: 600 25px/1 'Mono', monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text);
        white-space: nowrap;
        box-shadow: 0 24px 60px -12px rgb(0 0 0 / 0.8);
        transform-origin: 50% 50%;
      }
      .chip > i {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: var(--text);
        box-shadow: 0 0 0 6px rgb(255 255 255 / 0.13);
      }
      .chip.step {
        gap: 18px;
        padding: 12px 30px 12px 12px;
        font: 600 30px/1 'Inter';
        letter-spacing: -0.01em;
        text-transform: none;
        transform-origin: 0 50%;
      }
      .ck {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: var(--text);
        color: var(--bg);
      }

      /* Devices */
      .phone {
        position: absolute;
        left: 0;
        top: 0;
        background: linear-gradient(150deg, #44444a 0%, #1a1a1d 26%, #0c0c0d 62%, #2a2a2f 100%);
        box-shadow:
          inset 0 0 0 2px rgb(255 255 255 / 0.12),
          inset 0 0 0 7px #050505,
          0 100px 160px -40px rgb(0 0 0 / 0.95),
          0 0 0 1px rgb(0 0 0 / 0.9);
        transform-origin: 50% 50%;
      }
      .screen {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      .screen > img {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        display: block;
      }
      .sheen {
        position: absolute;
        inset: 0;
        background: linear-gradient(112deg, transparent 38%, rgb(255 255 255 / 0.075) 48%, transparent 58%);
        background-size: 320% 100%;
      }
      .ov {
        position: absolute;
        left: 0;
        top: 0;
        width: 1170px;
        height: 2532px;
        transform-origin: 0 0;
      }
      .mk {
        position: absolute;
        width: 2px;
        height: 2px;
      }
      .win {
        position: absolute;
        left: 0;
        top: 0;
        border-radius: 22px;
        overflow: hidden;
        background: #0e0e0f;
        box-shadow:
          inset 0 0 0 1.5px rgb(255 255 255 / 0.13),
          0 100px 180px -40px #000;
        transform-origin: 50% 50%;
      }
      .win .bar {
        height: 48px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 20px;
        background: #141416;
        border-bottom: 1px solid rgb(255 255 255 / 0.08);
      }
      .win .bar i {
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: #3a3a3f;
      }
      .win .bar span {
        margin-left: 22px;
        width: 340px;
        height: 30px;
        border-radius: 9px;
        background: #0a0a0b;
        color: var(--muted);
        font: 500 16px/30px 'Inter';
        padding: 0 14px;
      }
      .win img {
        display: block;
        width: 100%;
      }
      .strip {
        position: absolute;
        left: 0;
        top: 0;
        border-radius: 28px;
        background-repeat: no-repeat;
        box-shadow:
          inset 0 0 0 1.5px rgb(255 255 255 / 0.14),
          0 50px 100px -20px rgb(0 0 0 / 0.95);
        transform-origin: 50% 50%;
      }

      /* End card */
      .center {
        position: absolute;
        left: 0;
        width: 1080px;
        text-align: center;
      }
      .wordmark {
        font-weight: 760;
        font-size: 210px;
        line-height: 1;
        letter-spacing: -0.055em;
      }
      .wordmark .w {
        display: inline-block;
        overflow: hidden;
        padding: 0.04em 0.06em 0.12em;
      }
      .wordmark .i {
        display: inline-block;
      }
      .tagline {
        font-weight: 500;
        font-size: 50px;
        line-height: 1.2;
        letter-spacing: -0.02em;
        color: var(--muted);
      }
      .facts {
        display: flex;
        justify-content: center;
        gap: 16px;
      }
      .facts span {
        padding: 16px 26px 15px;
        border-radius: 999px;
        border: 1.5px solid rgb(255 255 255 / 0.2);
        font: 600 28px/1 'Inter';
        letter-spacing: -0.01em;
      }
      .url {
        display: inline-flex;
        align-items: center;
        gap: 18px;
        padding: 26px 44px 25px;
        border-radius: 999px;
        background: var(--text);
        color: var(--bg);
        font-weight: 720;
        font-size: 60px;
        line-height: 1;
        letter-spacing: -0.035em;
      }
      .foot {
        font: 500 21px/1.6 'Mono', monospace;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--faint);
      }
      #scan {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 4px;
        background: #fff;
        box-shadow:
          0 0 18px 4px rgb(255 255 255 / 0.75),
          0 0 90px 26px rgb(255 255 255 / 0.2);
        display: none;
        z-index: 100;
      }
    </style>
  </head>
  <body>
    <div id="stage"><div id="scan"></div></div>
    <script type="module">
      // Ohmic's TikTok promo, as a page that draws any moment on request: renderAt(seconds).
      // render.mjs steps it frame by frame; opened on its own it plays in a loop (?t=5 holds a moment).
      const W = 1080
      const H = 1920
      const SVG = 'http://www.w3.org/2000/svg'
      const params = new URLSearchParams(location.search)
      const RENDER = params.has('render')
      const stage = document.getElementById('stage')
      const scan = document.getElementById('scan')
      let SCALE = 1

      const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v))
      const prog = (t, at, dur) => clamp((t - at) / dur)
      const lerp = (a, b, p) => a + (b - a) * p
      const E = {
        out3: (p) => 1 - (1 - p) ** 3,
        out5: (p) => 1 - (1 - p) ** 5,
        expo: (p) => (p >= 1 ? 1 : 1 - 2 ** (-10 * p)),
        inOut: (p) => (p < 0.5 ? 4 * p ** 3 : 1 - (-2 * p + 2) ** 3 / 2),
        back: (p) => (p <= 0 ? 0 : 1 + 2.4 * (p - 1) ** 3 + 1.4 * (p - 1) ** 2),
      }
      const el = (tag, cls, parent, html) => {
        const e = document.createElement(tag)
        if (cls) e.className = cls
        if (html != null) e.innerHTML = html
        if (parent) parent.append(e)
        return e
      }
      const svgEl = (tag, attrs, parent) => {
        const e = document.createElementNS(SVG, tag)
        for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v)
        if (parent) parent.append(e)
        return e
      }
      const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;')

      // ---- Footage ----
      const manifest = await (await fetch('shots/manifest.json')).json()
      const shot = (name) => `shots/${manifest[name].file}`
      /** The frame of a captured sequence at a moment, looping or holding the last. */
      function frameAt(name, sec, loop = true) {
        const { files, times } = manifest[name]
        const step = times[1] - times[0] || 0.2
        const span = times[times.length - 1] + step
        const s = loop ? ((sec % span) + span) % span : clamp(sec, 0, span)
        let i = 0
        while (i + 1 < times.length && times[i + 1] <= s) i++
        return `shots/${files[i]}`
      }
      const setSrc = (img, src) => img.getAttribute('src') !== src && img.setAttribute('src', src)

      // ---- Building blocks ----
      function place(node, w, h, { x = 540, y = 960, z = 0, rx = 0, ry = 0, rz = 0, s = 1, o = 1 }) {
        node.style.transform = `translate3d(${x - w / 2}px, ${y - h / 2}px, ${z}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s})`
        node.style.opacity = o
      }

      function makePhone(parent, w) {
        const bez = Math.round(w * 0.032)
        const sw = w - 2 * bez
        const sh = Math.round((sw * 2532) / 1170)
        const h = sh + 2 * bez
        const root = el('div', 'phone', parent)
        Object.assign(root.style, { width: `${w}px`, height: `${h}px`, padding: `${bez}px`, borderRadius: `${Math.round(w * 0.14)}px` })
        const screen = el('div', 'screen', root)
        screen.style.borderRadius = `${Math.round(w * 0.14 - bez)}px`
        const a = el('img', '', screen)
        const b = el('img', '', screen)
        const ov = el('div', 'ov', screen)
        ov.style.transform = `scale(${sw / 1170})`
        const sheen = el('div', 'sheen', screen)
        return {
          root,
          ov,
          screen,
          w,
          h,
          scroll(y, fill = '#000') {
            for (const img of [a, b]) img.style.transform = `translateY(${(-y * sw) / 1170}px)`
            screen.style.background = fill
          },
          show(src, next = null, mix = 0) {
            setSrc(a, src)
            if (next && mix > 0) {
              setSrc(b, next)
              b.style.display = ''
              b.style.opacity = mix
            } else b.style.display = 'none'
          },
          place(o) {
            place(root, w, h, o)
            sheen.style.backgroundPosition = `${50 + (o.ry ?? 0) * 4 + (o.rz ?? 0) * 3}% 0`
          },
          marker(x, y) {
            const m = el('div', 'mk', ov)
            m.style.left = `${x}px`
            m.style.top = `${y}px`
            return m
          },
        }
      }

      function makeScene(spec) {
        const root = el('div', 'scene', stage)
        el('div', 'glow', root)
        const grid = el('div', 'grid', root)
        const s = { ...spec, root, grid }
        // Devices go straight in the scene, so its perspective applies to them.
        s.deco = svgEl('svg', { class: 'deco', width: W, height: H, viewBox: `0 0 ${W} ${H}` }, root)
        return s
      }
      const linesFor = (s) => (s.lines ??= svgEl('svg', { class: 'lines', width: W, height: H, viewBox: `0 0 ${W} ${H}` }, s.root))

      function makeEyebrow(parent, n, label, tag = '') {
        return { e: el('div', 'eyebrow', parent), n: `[0${n}/08]`, label, tag }
      }
      function animEyebrow(eb, lt, at = 0) {
        const full = `${eb.n}  ${eb.label}`
        const p = prog(lt, at, 0.4)
        const shown = full.slice(0, Math.round(p * full.length))
        const after = lt - at - 0.4
        const cursor = p < 1 || (after < 1 && Math.floor(after * 4) % 2 === 1)
        const tag = eb.tag && after > 0.15 ? `<span class="tag">${esc(eb.tag)}</span>` : ''
        eb.e.innerHTML = `<b>${esc(shown.slice(0, eb.n.length))}</b>${esc(shown.slice(eb.n.length))}${cursor ? '<span class="cur"></span>' : ''}${tag}`
      }

      /** Lines of words that rise into place; a word in <angle brackets> gets the white mark. */
      function makeHeadline(parent, lines, { top = 258, size = 124 } = {}) {
        const root = el('div', 'hl', parent)
        root.style.top = `${top}px`
        root.style.fontSize = `${size}px`
        const words = []
        for (const line of lines) {
          const ln = el('span', 'ln', root)
          line.split(' ').forEach((raw, k) => {
            if (k) ln.append(' ')
            const mark = raw.startsWith('<') && raw.endsWith('>')
            const word = mark ? raw.slice(1, -1) : raw
            const wrap = el('span', mark ? 'wrap mark' : 'wrap', ln)
            const i = el('span', 'i', el('span', 'w', wrap))
            i.textContent = word
            let hi = null
            if (mark) {
              hi = el('span', 'hi', wrap)
              el('span', 'ink', hi).textContent = word
            }
            words.push({ i, hi })
          })
        }
        return { root, words, size }
      }
      function fitHeadline(h, maxW = 900) {
        const widthOf = (ln) => {
          const w = ln.querySelectorAll('.wrap')
          return (w[w.length - 1].getBoundingClientRect().right - w[0].getBoundingClientRect().left) / SCALE
        }
        const widest = Math.max(...[...h.root.children].map(widthOf))
        if (widest > maxW) h.root.style.fontSize = `${Math.floor((h.size * maxW) / widest)}px`
      }
      function animHeadline(h, lt, { at = 0, stagger = 0.08, dur = 0.55, markAt = null } = {}) {
        h.words.forEach((w, k) => {
          const p = E.expo(prog(lt, at + k * stagger, dur))
          w.i.style.transform = `translateY(${(1 - p) * 112}%)`
          if (w.hi) {
            const q = E.inOut(prog(lt, markAt ?? at + h.words.length * stagger + 0.2, 0.34))
            w.hi.style.clipPath = `inset(0 ${(1 - q) * 100}% 0 0 round 0.17em)`
            w.hi.style.visibility = q > 0 ? 'visible' : 'hidden'
          }
        })
      }

      /** A label on a line, pinned to a point on a device screen. */
      function makeCallout(s, marker, html, cx, cy) {
        const svg = linesFor(s)
        const line = svgEl('line', { stroke: '#f5f5f6', 'stroke-width': 2.5, 'stroke-linecap': 'round', opacity: 0.85 }, svg)
        const halo = svgEl('circle', { fill: 'rgb(255 255 255 / 0.16)' }, svg)
        const dot = svgEl('circle', { fill: '#f5f5f6' }, svg)
        const chip = el('div', 'chip', s.root, `<i></i>${html}`)
        return { chip, line, halo, dot, marker, cx, cy, w: 0, h: 0 }
      }
      function pointOf(node) {
        const r = node.getBoundingClientRect()
        const st = stage.getBoundingClientRect()
        return [(r.left + r.width / 2 - st.left) / SCALE, (r.top + r.height / 2 - st.top) / SCALE]
      }
      function animCallout(c, lt, at) {
        const [px, py] = pointOf(c.marker)
        const p = E.out3(prog(lt, at + 0.06, 0.32))
        const q = E.back(prog(lt, at + 0.16, 0.42))
        const d = E.back(prog(lt, at, 0.3))
        // The line meets the chip's nearest edge: a side, or the top or bottom when the point is under it.
        let ax
        let ay = c.cy
        if (px < c.cx - c.w / 2) ax = c.cx - c.w / 2 + 6
        else if (px > c.cx + c.w / 2) ax = c.cx + c.w / 2 - 6
        else {
          ax = clamp(px, c.cx - c.w / 2 + c.h / 2, c.cx + c.w / 2 - c.h / 2)
          ay = py < c.cy ? c.cy - c.h / 2 + 4 : c.cy + c.h / 2 - 4
        }
        c.line.setAttribute('x1', px)
        c.line.setAttribute('y1', py)
        c.line.setAttribute('x2', lerp(px, ax, p))
        c.line.setAttribute('y2', lerp(py, ay, p))
        c.line.style.display = p > 0 ? '' : 'none'
        for (const [n, r] of [
          [c.dot, 8],
          [c.halo, 20],
        ]) {
          n.setAttribute('cx', px)
          n.setAttribute('cy', py)
          n.setAttribute('r', Math.max(0, r * d))
        }
        c.chip.style.transform = `translate(${c.cx - c.w / 2}px, ${c.cy - c.h / 2}px) scale(${lerp(0.55, 1, q)})`
        c.chip.style.opacity = clamp(q * 1.6)
      }

      /** A speedometer arc: ticks and a sweep that fills. */
      function makeDial(svg, { cx, cy, r, from = 150, to = 390, ticks = 41, opacity = 0.2 }) {
        const g = svgEl('g', { opacity }, svg)
        const pt = (a, rr) => [cx + rr * Math.cos((a * Math.PI) / 180), cy + rr * Math.sin((a * Math.PI) / 180)]
        const arcPath = (a0, a1, rr) => {
          const [x0, y0] = pt(a0, rr)
          const [x1, y1] = pt(a1, rr)
          return `M${x0} ${y0} A${rr} ${rr} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1} ${y1}`
        }
        const track = svgEl('path', { d: arcPath(from, to, r), fill: 'none', stroke: '#fff', 'stroke-width': 2 }, g)
        const len = (Math.PI * r * (to - from)) / 180
        track.style.strokeDasharray = `${len} ${len}`
        const tickEls = []
        for (let k = 0; k < ticks; k++) {
          const a = from + ((to - from) * k) / (ticks - 1)
          const major = k % 5 === 0
          const [x0, y0] = pt(a, r - 18)
          const [x1, y1] = pt(a, r - (major ? 62 : 36))
          tickEls.push(svgEl('line', { x1: x0, y1: y0, x2: x1, y2: y1, stroke: '#fff', 'stroke-width': major ? 4 : 2, 'stroke-linecap': 'round' }, g))
        }
        const fill = svgEl('path', { d: arcPath(from, to, r + 22), fill: 'none', stroke: '#fff', 'stroke-width': 7, 'stroke-linecap': 'round' }, svg)
        const flen = (Math.PI * (r + 22) * (to - from)) / 180
        fill.style.strokeDasharray = `${flen} ${flen}`
        return {
          set(draw, level, fillOpacity = 0.55) {
            track.style.strokeDashoffset = len * (1 - draw)
            tickEls.forEach((t, k) => {
              const at = k / (ticks - 1)
              t.style.opacity = at <= draw ? (at <= level ? 1 : 0.45) : 0
            })
            fill.style.strokeDashoffset = flen * (1 - level)
            fill.style.opacity = level > 0.001 ? fillOpacity : 0
          },
        }
      }

      const CHECK = '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'

      // ---- The scenes: 21 s, cuts on a 120 BPM grid ----
      const scenes = []
      const scene = (spec) => scenes.push(makeScene(spec))

      // 1. The hook.
      scene({
        start: 0,
        build(s) {
          s.dial = makeDial(s.deco, { cx: 540, cy: 1330, r: 600, opacity: 0.16 })
          s.ph = makePhone(s.root, 660)
          s.eb = makeEyebrow(s.root, 1, 'Ohmic · for VESC-based builds')
          s.hl = makeHeadline(s.root, ['Your scooter,', 'tuned in a <tab.>'])
        },
        update(s, lt) {
          animEyebrow(s.eb, lt, -0.12)
          animHeadline(s.hl, lt, { at: -0.14, stagger: 0.09, markAt: 0.72 })
          const p = E.out5(prog(lt, -0.25, 1.25))
          s.ph.place({ x: 540, y: lerp(2650, 1335, p), rx: lerp(38, 9, p), ry: lerp(-2, -15, p) + Math.sin(lt * 1.3) * 1.2, rz: lerp(-5, 2.5, p), s: 1 + lt * 0.016 })
          s.ph.show(frameAt('gauges', lt))
          s.dial.set(E.out3(prog(lt, 0, 0.9)), E.inOut(prog(lt, 0.35, 1.4)) * 0.62)
          s.grid.style.transform = `translateY(${-lt * 16}px)`
        },
      })

      // 2. Live values.
      scene({
        start: 2.5,
        trans: 'punch',
        build(s) {
          s.ph = makePhone(s.root, 650)
          // Pinned to the edges of the dials, so the numbers stay clear.
          const m = (x, y) => s.ph.marker(x, y)
          s.calls = [
            makeCallout(s, m(106, 610), 'Battery A', 168, 880),
            makeCallout(s, m(1012, 470), 'Duty %', 896, 760),
            makeCallout(s, m(262, 1160), 'Speed', 150, 1190),
            makeCallout(s, m(100, 1700), 'Temps °C', 176, 1490),
          ]
          s.eb = makeEyebrow(s.root, 2, 'Live data · up to 50 Hz')
          s.hl = makeHeadline(s.root, ['Every value.', '<Live.>'])
        },
        update(s, lt) {
          animEyebrow(s.eb, lt, 0.04)
          animHeadline(s.hl, lt, { at: 0.02, stagger: 0.09, markAt: 0.42 })
          const push = E.inOut(prog(lt, 0, 2.3))
          s.ph.place({ x: 622, y: 1330 - push * 30, rx: 5, ry: 8 - push * 6, rz: -1.5, s: 1 + push * 0.07 })
          s.ph.show(frameAt('gauges', lt + 2.5))
          s.calls.forEach((c, k) => animCallout(c, lt, 0.32 + k * 0.22))
          s.grid.style.transform = `translateY(${-(lt + 2.5) * 16}px)`
        },
      })

      // 3. Three ways to see it.
      scene({
        start: 4.5,
        trans: 'sweep',
        build(s) {
          s.left = makePhone(s.root, 480)
          s.right = makePhone(s.root, 480)
          s.mid = makePhone(s.root, 500)
          s.eb = makeEyebrow(s.root, 3, 'Your dashboard')
          s.hl = makeHeadline(s.root, ['Dials. Tiles.', 'Or just <speed.>'])
        },
        update(s, lt) {
          animEyebrow(s.eb, lt, 0.04)
          animHeadline(s.hl, lt, { at: 0.04, stagger: 0.1, markAt: 0.62 })
          const f = (k) => E.out5(prog(lt, 0.02 + k * 0.08, 0.8))
          const sway = Math.sin(lt * 1.4) * 1.5
          s.mid.place({ x: 540, y: lerp(1560, 1265, f(0)), rx: 7, ry: sway, s: 1 })
          s.left.place({ x: lerp(540, 238, f(1)), y: lerp(1560, 1330, f(1)), z: lerp(-40, -300, f(1)), rx: 7, ry: lerp(0, 28, f(1)) + sway, rz: lerp(0, -3, f(1)) })
          s.right.place({ x: lerp(540, 842, f(2)), y: lerp(1560, 1330, f(2)), z: lerp(-40, -300, f(2)), rx: 7, ry: lerp(0, -28, f(2)) + sway, rz: lerp(0, 3, f(2)) })
          s.left.show(frameAt('gauges', lt + 1))
          s.mid.show(frameAt('tiles', lt))
          s.right.show(frameAt('focus', lt))
          s.grid.style.transform = `translateY(${-(lt + 4.5) * 16}px)`
        },
      })

      // 4. Setup, ticked off.
      scene({
        start: 6.5,
        trans: 'punch',
        build(s) {
          s.ph = makePhone(s.root, 690)
          s.ph.show(shot('setup'))
          s.patch = el('div', '', s.ph.ov)
          Object.assign(s.patch.style, { position: 'absolute', left: '850px', top: '476px', width: '232px', height: '64px' })
          s.count = el('div', '', s.ph.ov)
          Object.assign(s.count.style, { position: 'absolute', right: '100px', top: '476px', height: '64px', font: '400 42px/64px Inter', color: '#a1a1a8', whiteSpace: 'nowrap' })
          s.checks = [755, 1013, 1271, 1530].map((y) => {
            const c = el('div', 'ck', s.ph.ov, CHECK.replace(/28/g, '52'))
            Object.assign(c.style, { position: 'absolute', left: `${186 - 50}px`, top: `${y - 50}px`, width: '100px', height: '100px' })
            return c
          })
          s.eb = makeEyebrow(s.root, 4, 'Setup')
          s.hl = makeHeadline(s.root, ['New build?', '<Four> steps.'])
        },
        update(s, lt) {
          animEyebrow(s.eb, lt, 0.04)
          animHeadline(s.hl, lt, { at: 0.02, stagger: 0.09, markAt: 0.4 })
          const push = E.inOut(prog(lt, 0, 2.3))
          s.ph.place({ x: 540, y: 1335 - push * 20, rx: 7, ry: lerp(16, 9, push), rz: -2, s: 1 + push * 0.04 })
          let done = 0
          s.checks.forEach((c, k) => {
            const p = E.back(prog(lt, 0.5 + k * 0.25, 0.32))
            if (lt >= 0.5 + k * 0.25 + 0.08) done = k + 1
            c.style.transform = `scale(${p})`
            c.style.opacity = clamp(p * 2)
          })
          s.count.textContent = `${done} of 4 done`
          s.grid.style.transform = `translateY(${-(lt + 6.5) * 16}px)`
        },
      })

      // 5. Every setting, written the careful way.
      scene({
        start: 8.5,
        trans: 'sweep',
        build(s) {
          s.ph = makePhone(s.root, 650)
          s.eb = makeEyebrow(s.root, 5, 'Tune')
          s.hl = makeHeadline(s.root, ['Every setting.', 'Written <safely.>'])
          s.rail = el('div', '', s.root)
          Object.assign(s.rail.style, { position: 'absolute', left: '106px', width: '3px', background: 'rgb(255 255 255 / 0.5)', transformOrigin: '50% 0' })
          s.steps = ['Checked against its limits', 'Backed up first', 'Written', 'Read back and verified'].map((t) => el('div', 'chip step', s.root, `<span class="ck">${CHECK}</span>${t}`))
        },
        update(s, lt) {
          animEyebrow(s.eb, lt, 0.04)
          animHeadline(s.hl, lt, { at: 0.02, stagger: 0.09, markAt: 0.5 })
          const push = E.inOut(prog(lt, 0, 2.8))
          s.ph.place({ x: 668, y: 1340 - push * 24, rx: 6, ry: lerp(-14, -8, push), rz: 1.5, s: 1 + push * 0.04 })
          const a = prog(lt, 0.95, 0.14)
          const b = prog(lt, 1.55, 0.14)
          if (lt < 1.2) s.ph.show(shot('tune-search'), shot('review'), a)
          else s.ph.show(shot('review'), shot('verified'), b)
          // Bring the "Written and verified" sheet up, clear of TikTok's caption.
          s.ph.scroll(E.inOut(prog(lt, 1.62, 0.45)) * 600, s.sheet)
          const y0 = 652
          s.steps.forEach((c, k) => {
            const p = E.out5(prog(lt, 0.9 + k * 0.26, 0.45))
            c.style.transform = `translate(${70 + (1 - p) * -60}px, ${y0 + k * 110 - 38}px)`
            c.style.opacity = p
          })
          const r = E.inOut(prog(lt, 0.95, 0.26 * 3 + 0.2))
          Object.assign(s.rail.style, { top: `${y0}px`, height: `${330}px`, transform: `scaleY(${r})` })
          s.grid.style.transform = `translateY(${-(lt + 8.5) * 16}px)`
        },
      })

      // 6. The auto-wheelie.
      scene({
        start: 11,
        trans: 'punch',
        build(s) {
          s.ph = makePhone(s.root, 700)
          s.calls = [makeCallout(s, s.ph.marker(84, 372), 'Angle', 128, 862), makeCallout(s, s.ph.marker(1040, 600), 'Holds 10°', 548, 902)]
          s.eb = makeEyebrow(s.root, 6, 'Auto-wheelie', 'Beta')
          s.hl = makeHeadline(s.root, ['Lean back.', 'It <holds.>'])
        },
        update(s, lt) {
          animEyebrow(s.eb, lt, 0.04)
          animHeadline(s.hl, lt, { at: 0.02, stagger: 0.09, markAt: 0.42 })
          const push = E.inOut(prog(lt, 0, 2.6))
          s.ph.place({ x: 540, y: 1300 - push * 26, rx: 6, ry: lerp(-12, -6, push), rz: 2, s: 1 + push * 0.06 })
          s.ph.show(frameAt('wheelie', 0.1 + lt * 1.2, false))
          s.calls.forEach((c, k) => animCallout(c, lt, 0.55 + k * 0.28))
          s.grid.style.transform = `translateY(${-(lt + 11) * 16}px)`
        },
      })

      // 7. Ride modes, regen, ABS.
      scene({
        start: 13.5,
        trans: 'sweep',
        build(s) {
          s.ph = makePhone(s.root, 640)
          s.ph.show(shot('modes'))
          // The mode switches from the dashboard, pulled out large.
          const k = 980 / 1090
          s.strip = el('div', 'strip', s.root)
          Object.assign(s.strip.style, {
            width: '980px',
            height: `${Math.round(160 * k)}px`,
            backgroundImage: `url(${frameAt('gauges', 2)})`,
            backgroundSize: `${1170 * k}px auto`,
            backgroundPosition: `${-40 * k}px ${-2140 * k}px`,
            backgroundColor: '#050505',
          })
          s.stripH = Math.round(160 * k)
          s.stripSrc = frameAt('gauges', 2)
          s.eb = makeEyebrow(s.root, 7, 'Features')
          s.hl = makeHeadline(s.root, ['Ride modes.', 'Regen. <ABS.>'])
        },
        update(s, lt) {
          animEyebrow(s.eb, lt, 0.04)
          animHeadline(s.hl, lt, { at: 0.02, stagger: 0.24, dur: 0.5, markAt: 0.95 })
          const push = E.inOut(prog(lt, 0, 2.3))
          s.ph.place({ x: 540, y: 1420 - push * 24, rx: 8, ry: lerp(10, 5, push), rz: -1.5, s: 1 })
          const q = E.back(prog(lt, 0.3, 0.5))
          place(s.strip, 980, s.stripH, { x: 540, y: 712 - push * 10, z: 0, rx: 10, ry: lerp(4, 0, push), s: lerp(0.7, 1, q), o: clamp(q * 1.8) })
          s.grid.style.transform = `translateY(${-(lt + 13.5) * 16}px)`
        },
      })

      // 8. Any screen, either look.
      scene({
        start: 15.5,
        trans: 'punch',
        build(s) {
          s.win = el('div', 'win', s.root, `<div class="bar"><i></i><i></i><i></i><span>ohmic.live</span></div><img src="${shot('desk-tiles')}">`)
          s.winW = 1040
          s.winH = 48 + Math.round((1040 * 1800) / 2880)
          s.win.style.width = `${s.winW}px`
          s.dark = makePhone(s.root, 430)
          s.light = makePhone(s.root, 430)
          s.light.show(shot('tiles-light'))
          s.eb = makeEyebrow(s.root, 8, 'Every screen')
          s.hl = makeHeadline(s.root, ['Phone or laptop.', 'Dark or <light.>'])
        },
        update(s, lt) {
          animEyebrow(s.eb, lt, 0.04)
          animHeadline(s.hl, lt, { at: 0.02, stagger: 0.08, markAt: 0.55 })
          const push = E.inOut(prog(lt, 0, 2.3))
          const w = E.out5(prog(lt, 0, 0.8))
          place(s.win, s.winW, s.winH, { x: 560, y: lerp(1150, 990, w) - push * 14, z: -220, rx: 8, ry: lerp(-20, -14, push), rz: 1 })
          s.win.style.opacity = clamp(w * 2)
          const a = E.out5(prog(lt, 0.18, 0.8))
          const b = E.out5(prog(lt, 0.32, 0.8))
          s.dark.place({ x: 300, y: lerp(2300, 1500, a), rx: 8, ry: 14, rz: -5 })
          s.light.place({ x: 776, y: lerp(2360, 1540, b), rx: 8, ry: -14, rz: 5 })
          s.dark.show(frameAt('tiles', lt + 1))
          s.grid.style.transform = `translateY(${-(lt + 15.5) * 16}px)`
        },
      })

      // 9. The end card.
      scene({
        start: 17.5,
        trans: 'sweep',
        build(s) {
          s.dial = makeDial(s.deco, { cx: 540, cy: 520, r: 270, from: 135, to: 405, ticks: 46, opacity: 0.32 })
          s.logo = svgEl('svg', { width: 220, height: 220, viewBox: '0 0 32 32' }, s.root)
          Object.assign(s.logo.style, { position: 'absolute', left: '430px', top: '410px', overflow: 'visible' })
          s.logo.innerHTML =
            '<rect x="1" y="1" width="30" height="30" rx="9" fill="#1d1d1f" stroke="rgb(255 255 255 / 0.16)" stroke-width="0.6"/>' +
            '<path class="arc" d="M22.5 9.2A9 9 0 1 0 25 16" fill="none" stroke="#f5f5f6" stroke-width="2.6" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1"/>' +
            '<path class="bolt" d="M17.6 9.5 12.4 17h4.1l-1.6 5.6 5.6-7.9h-4.2l1.3-5.2Z" fill="#f5f5f6"/>'
          s.arc = s.logo.querySelector('.arc')
          s.bolt = s.logo.querySelector('.bolt')
          s.bolt.style.transformOrigin = '16px 16px'
          s.word = el('div', 'center wordmark', s.root, '<span class="w"><span class="i">Ohmic</span></span>')
          s.word.style.top = '770px'
          s.wordI = s.word.querySelector('.i')
          s.tag = el('div', 'center tagline', s.root, 'Set up, tune and ride<br>your VESC build.')
          s.tag.style.top = '1018px'
          s.facts = el('div', 'center facts', s.root, '<span>Free</span><span>Bluetooth or USB</span><span>Works offline</span>')
          s.facts.style.top = '1180px'
          s.factEls = [...s.facts.children]
          s.urlRow = el('div', 'center', s.root, '<span class="url">ohmic.live <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>')
          s.urlRow.style.top = '1290px'
          s.url = s.urlRow.firstChild
          s.foot = el('div', 'center foot', s.root, 'Built on the open VESC protocol<br>Not affiliated with the VESC project · demo footage')
          s.foot.style.top = '1440px'
        },
        update(s, lt) {
          s.dial.set(E.out3(prog(lt, 0.05, 0.8)), E.inOut(prog(lt, 0.25, 1.3)) * 0.78, 0.7)
          s.arc.style.strokeDashoffset = 1 - E.out3(prog(lt, 0.1, 0.6))
          const b = E.back(prog(lt, 0.45, 0.4))
          s.bolt.style.transform = `scale(${b})`
          const l = E.out5(prog(lt, 0, 0.5))
          s.logo.style.transform = `scale(${lerp(0.8, 1, l)})`
          s.logo.style.opacity = l
          s.wordI.style.transform = `translateY(${(1 - E.expo(prog(lt, 0.3, 0.6))) * 112}%)`
          const t = E.out5(prog(lt, 0.6, 0.6))
          s.tag.style.transform = `translateY(${(1 - t) * 30}px)`
          s.tag.style.opacity = t
          s.factEls.forEach((f, k) => {
            const p = E.back(prog(lt, 0.85 + k * 0.1, 0.4))
            f.style.transform = `scale(${lerp(0.6, 1, p)})`
            f.style.opacity = clamp(p * 1.6)
          })
          const u = E.back(prog(lt, 1.2, 0.45))
          s.url.style.transform = `scale(${lerp(0.7, 1, u)})`
          s.url.style.opacity = clamp(u * 1.6)
          s.foot.style.opacity = E.out3(prog(lt, 1.5, 0.5))
          s.grid.style.transform = `translateY(${-(lt + 17.5) * 16}px)`
        },
      })

      const DURATION = 21
      const TR = 0.3
      scenes.forEach((s, k) => {
        s.end = k + 1 < scenes.length ? scenes[k + 1].start + TR : DURATION
        s.root.style.zIndex = k + 1
        s.build(s)
      })

      // Size things once the fonts are in: headlines fit the width, callouts know their size.
      await Promise.all(['760 124px Inter', '400 42px Inter', '600 30px Inter', '600 25px Mono', '500 21px Mono'].map((f) => document.fonts.load(f)))
      for (const s of scenes) s.root.style.display = 'block'
      for (const s of scenes) {
        if (s.hl) fitHeadline(s.hl)
        for (const c of s.calls ?? []) {
          c.w = c.chip.offsetWidth
          c.h = c.chip.offsetHeight
        }
      }
      for (const s of scenes) s.root.style.display = 'none'

      // Background images aren't fetched while hidden: load the one there is now.
      {
        const img = new Image()
        img.src = scenes[6].stripSrc
        await img.decode()
      }

      // The "0 of 4 done" in the setup shot is covered with the card's own colour.
      {
        const img = new Image()
        img.src = shot('setup')
        await img.decode()
        const c = document.createElement('canvas')
        c.width = 1
        c.height = 1
        const g = c.getContext('2d')
        g.drawImage(img, 980, 455, 1, 1, 0, 0, 1, 1)
        const [r, gg, b] = g.getImageData(0, 0, 1, 1).data
        scenes[3].patch.style.background = `rgb(${r} ${gg} ${b})`
        // And the colour of the sheet in the "verified" shot, to fill below it as it scrolls up.
        const v = new Image()
        v.src = shot('verified')
        await v.decode()
        g.drawImage(v, 585, 2515, 1, 1, 0, 0, 1, 1)
        const [vr, vg, vb] = g.getImageData(0, 0, 1, 1).data
        scenes[4].sheet = `rgb(${vr} ${vg} ${vb})`
      }

      function renderAt(t) {
        scan.style.display = 'none'
        scenes.forEach((s, k) => {
          const on = t >= s.start && t < s.end
          s.root.style.display = on ? 'block' : 'none'
          if (!on) return
          s.root.style.clipPath = ''
          s.root.style.filter = ''
          s.root.style.transform = ''
          s.root.style.opacity = ''
          const lt = t - s.start
          // Coming in.
          if (s.trans && lt < TR) {
            const p = lt / TR
            if (s.trans === 'sweep') {
              const e = E.inOut(p)
              s.root.style.clipPath = `inset(0 0 ${(1 - e) * 100}% 0)`
              scan.style.display = 'block'
              scan.style.transform = `translateY(${e * H - 2}px)`
              scan.style.opacity = 1 - E.inOut(prog(p, 0.75, 0.25))
            } else {
              const e = E.out3(p)
              s.root.style.opacity = clamp(p * 3)
              s.root.style.transform = `scale(${lerp(1.14, 1, e)})`
              s.root.style.filter = `blur(${(1 - e) * 18}px)`
            }
          }
          // Going out under a punch.
          const next = scenes[k + 1]
          if (next && t >= next.start && next.trans === 'punch') {
            const e = E.out3(prog(t, next.start, TR))
            s.root.style.transform = `scale(${lerp(1, 0.9, e)})`
            s.root.style.filter = `blur(${e * 14}px)`
          }
          s.update(s, lt)
        })
      }

      async function settle() {
        const imgs = [...stage.querySelectorAll('img')].filter((i) => i.getAttribute('src') && i.offsetParent)
        await Promise.all(imgs.map((i) => i.decode().catch(() => {})))
      }

      window.DURATION = DURATION
      window.renderAt = async (t) => {
        renderAt(t)
        await settle()
        // Positions of callouts depend on the images having laid out; draw once more.
        renderAt(t)
      }

      if (!RENDER) {
        const fit = () => {
          SCALE = Math.min(innerWidth / W, innerHeight / H)
          stage.style.transform = `scale(${SCALE})`
        }
        fit()
        addEventListener('resize', fit)
        const hold = params.get('t')
        if (hold != null) await window.renderAt(Number(hold))
        else {
          const t0 = performance.now()
          const tick = () => {
            renderAt(((performance.now() - t0) / 1000) % DURATION)
            requestAnimationFrame(tick)
          }
          tick()
        }
      }
      window.ready = true
    </script>
  </body>
</html>
