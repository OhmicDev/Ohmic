<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Encoder</title>
  </head>
  <body>
    <script>
      // H.264 encoding in the browser (WebCodecs), driven by render.mjs: it fetches each rendered
      // frame from /frame and hands back the encoded chunks.
      const toB64 = (u8) => {
        if (u8.toBase64) return u8.toBase64()
        let s = ''
        for (let k = 0; k < u8.length; k += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(k, k + 0x8000))
        return btoa(s)
      }
      let enc = null
      let fps = 30
      let meta = null
      let failed = null
      const chunks = []

      window.setup = async (opts) => {
        fps = opts.fps
        for (const codec of ['avc1.64002a', 'avc1.4d002a', 'avc1.42002a']) {
          for (const hardwareAcceleration of ['no-preference', 'prefer-software']) {
            const config = {
              codec,
              width: opts.width,
              height: opts.height,
              bitrate: opts.bitrate,
              framerate: fps,
              hardwareAcceleration,
              latencyMode: opts.latencyMode ?? 'quality',
              avc: { format: 'avc' },
            }
            const { supported } = await VideoEncoder.isConfigSupported(config)
            if (!supported) continue
            enc = new VideoEncoder({
              output: (chunk, md) => {
                const data = new Uint8Array(chunk.byteLength)
                chunk.copyTo(data)
                chunks.push({ key: chunk.type === 'key', ts: chunk.timestamp, data })
                if (md?.decoderConfig && !meta) meta = md.decoderConfig
              },
              error: (e) => (failed = String(e)),
            })
            enc.configure(config)
            return `${codec} (${hardwareAcceleration}, ${config.latencyMode})`
          }
        }
        throw new Error('This browser has no H.264 encoder for 1080×1920.')
      }

      const drain = () => chunks.splice(0).map((c) => ({ key: c.key, ts: c.ts, b64: toB64(c.data) }))

      window.encodeFrame = async (i) => {
        const blob = await (await fetch(`/frame?${i}`)).blob()
        const bmp = await createImageBitmap(blob)
        const frame = new VideoFrame(bmp, { timestamp: Math.round((i * 1e6) / fps), duration: Math.round(1e6 / fps) })
        enc.encode(frame, { keyFrame: i % (fps * 2) === 0 })
        frame.close()
        bmp.close()
        while (enc.encodeQueueSize > 2) await new Promise((r) => setTimeout(r, 4))
        if (failed) throw new Error(failed)
        return drain()
      }

      window.finish = async () => {
        await enc.flush()
        if (failed) throw new Error(failed)
        const d = meta.description
        const desc = d instanceof ArrayBuffer ? new Uint8Array(d) : new Uint8Array(d.buffer, d.byteOffset, d.byteLength)
        return { chunks: drain(), avcC: toB64(desc), colorSpace: meta.colorSpace ?? null, codec: meta.codec }
      }
    </script>
  </body>
</html>
