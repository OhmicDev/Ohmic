<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0b0f" />
    <!-- Added to a home screen it opens full screen, under a see-through status bar. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ohmic" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Configure, monitor and tune VESC-based motor controllers from your browser." />
    <title>Ohmic</title>
    <script>
      // Apply the saved theme before the first paint (the app keeps it in sync after).
      try {
        var t = (JSON.parse(localStorage.getItem('ohmic.settings') || '{}').state || {}).theme || 'dark'
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
        if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f5f5f7')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
